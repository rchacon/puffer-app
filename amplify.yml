# Amplify Hosting build spec. A repo-root amplify.yml takes precedence over
# the build_spec set on the Amplify app in puffer-infra's
# terraform/amplify/main.tf, so this file is the one Amplify actually runs.
# It lives here, not in Terraform, so a change to where the build output
# lands (e.g. the move into apps/game/) ships atomically with the code that
# causes it, instead of needing a coordinated cross-repo deploy.
#
# Single-app format at the repo root, not Amplify's `applications:`/`appRoot`
# monorepo format: `npm ci` has to run at the root anyway to install the
# workspaces, and `npm run build` proxies to apps/game.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: apps/game/dist
    files:
      - '**/*'
  # Cache npm's download cache, not node_modules: `npm ci` deletes
  # node_modules before installing, so caching it buys nothing --
  # caching .npm lets `npm ci --prefer-offline` install from local
  # tarballs instead of re-downloading every package each build.
  cache:
    paths:
      - .npm/**/*
